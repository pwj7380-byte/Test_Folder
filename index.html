<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현재 시간</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
  #date{font-size:1.4rem;opacity:.8}
  #time{font-size:clamp(3rem,15vw,8rem);font-weight:700;font-variant-numeric:tabular-nums}
  small{opacity:.5}
</style>
</head>
<body>
  <div id="date"></div>
  <div id="time"></div>
  <small>서울 시간 (Asia/Seoul)</small>
<script>
  function tick(){
    const now=new Date(), tz={timeZone:'Asia/Seoul'};
    document.getElementById('date').textContent=now.toLocaleDateString('ko-KR',{...tz,year:'numeric',month:'long',day:'numeric',weekday:'long'});
    document.getElementById('time').textContent=now.toLocaleTimeString('ko-KR',{...tz,hour12:false});
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
